[project]
name = "hoga-ops"
version = "0.1.0"
description = "Hogaplay orderbook + trade replay backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=16",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13",
    "watchdog>=6.0.0",
    "polars>=1.41.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
hoga = "hoga.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hoga*"]
exclude = ["tests*", "explorer*"]

[tool.setuptools.package-data]
# 거래일 달력 시드(PR-H·#1044). 조회 경로가 이 파일만 읽으므로 **패키지에 반드시
# 실려야 한다** — 빠지면 설치본에서 달력이 통째로 "모름" 이 된다.
"hoga.api" = ["trading_days_seed.txt", "kiwoom_master_seed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    # pydantic 이 **선언된 타입과 다른 값**을 직렬화할 때 내는 경고를 실패로 올린다.
    #
    # 왜 필요한가: `model_copy(update=...)` 는 **검증을 하지 않는다.** 모델로 선언된
    # 필드에 raw dict 를 대입해도 조용히 통과하고, 직렬화 때가 되어서야 이 경고가
    # 흐른다. 값은 우연히 같게 나가지만 검증을 건너뛴 채라, 키가 늘거나 타입이
    # 어긋나도 그대로 지나간다. 2026-08-24 에 두 곳에서 실제로 났다
    # (`rest_capacity_scheduler` · `traded_peaks`).
    #
    # ⚠ **이 가드의 한계 — 실행되지 않는 코드는 경고를 내지 않는다.** 위 두 건 중
    # `traded_peaks` 쪽(`bundle._peak_with_rep_outputs`)은 **테스트가 하나도 없어서**
    # 이 필터를 그때 걸어 두었더라도 못 잡았을 것이다. 커버리지가 먼저이고 이 필터는
    # 그 위에 얹는 그물이다.
    "error:Pydantic serializer warnings:UserWarning",
]
markers = [
    # 벽시계 경과시간을 단언하는 테스트. 로컬에서는 기본으로 실행되고, CI 는
    # `-m 'not wallclock'` 으로 제외한 뒤 별도 non-blocking 잡에서 돌린다.
    #
    # 왜 분리하나: 이들은 알고리즘이 아니라 스케줄링 지터를 측정한다. 공유
    # 러너에서 `0.05 < elapsed < 0.3` 같은 서브초 창은 이웃 잡의 부하만으로
    # 깨진다. 그 간헐 실패가 머지를 막을 수 있다는 우려가 CI 범위를 tsc 하나로
    # 묶어둔 이유였는데(.github/workflows/ci.yml 주석), 실측해 보니 대상은
    # 9개 함수뿐이었다 — 스위트 전체를 CI 밖에 두는 대가로는 너무 컸다.
    # (그 뒤로 늘었다. 정확한 수는 `pytest -m wallclock --collect-only` 로 센다.)
    #
    # 새로 붙일 때: 벽시계 단언을 결정론적 불변식(호출 횟수 등)으로 바꿀 수
    # 있으면 그게 우선이다. 이 마커는 그게 불가능할 때의 차선책이다.
    "wallclock: 경과시간 단언에 의존 — 공유 CI 러너에서 간헐 실패 가능",
]
