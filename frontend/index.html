<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hoga-ops</title>
    <!-- App type face (Pretendard) is self-hosted since ADR-0134 — imported in
         src/main.tsx from the `pretendard` npm package, so vite bundles the
         @font-face CSS into the entry stylesheet and emits the per-unicode-range
         woff2 chunks as local assets. No CDN: the font was the app's only
         external runtime dependency, and its render-blocking <link> made first
         paint hostage to jsdelivr. -->

    <!-- Theme bootstrap: set <html data-theme> BEFORE the module graph loads so
         the first paint is the right theme and projector modules resolve their
         colors against it (no FOUC, no wrong-theme chart cache). Mirrors
         state/themePrefs.ts — DEFAULT_THEME_PREFERENCE and the allowed values
         are duplicated here because this must run before any module loads.

         The preference IS the theme, so this block just validates and writes.
         It used to resolve a route map too (the `auto` preference), and that
         copy drifted once: OBSIDIAN_ROUTE_PREFIXES gained '/market' and this
         list did not, so `auto` painted /market ledger and then flipped it to
         obsidian — exactly the FOUC this block exists to prevent. `auto` was
         removed 2026-08-30 and the route map went with it; the remaining
         duplication (default + allowed values) is still guarded —
         themePrefs.test.ts parses this file and fails on any divergence, so
         edit BOTH sides or the test will tell you. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ui.themePreference.v1');
          var pref = raw ? JSON.parse(raw).themePreference : 'toss-light';
          if (pref !== 'obsidian' && pref !== 'ledger' && pref !== 'toss-light' && pref !== 'toss-dark') pref = 'toss-light';
          document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'obsidian');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
