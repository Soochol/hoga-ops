<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hoga-ops</title>
    <!-- App type face. Pretendard carries Latin + Hangul in one family and
         serves prose *and* data — the Tailwind font-ui/font-data utilities both
         resolve to it (tokens.css), differing only in figure style.
         dynamic-subset ships per-unicode-range woff2 chunks, so a cold load
         fetches only the ranges actually on screen instead of a multi-MB
         Hangul file. Render-blocking on purpose: the first paint should already
         have the right face (a swap would reflow every number column). -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      rel="stylesheet"
    />
    <!-- Theme bootstrap: set <html data-theme> BEFORE the module graph loads so
         the first paint is the right theme and projector modules resolve their
         colors against it (no FOUC, no wrong-theme chart cache). Mirrors
         state/themePrefs.ts effectiveTheme() — keep the two in sync. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ui.themePreference.v1');
          var pref = raw ? JSON.parse(raw).themePreference : 'auto';
          if (pref !== 'obsidian' && pref !== 'ledger' && pref !== 'auto') pref = 'auto';
          var theme = pref;
          if (pref === 'auto') {
            var p = location.pathname;
            var dark = p === '/live' || p.indexOf('/live/') === 0 || p === '/heatmap' || p.indexOf('/heatmap/') === 0;
            theme = dark ? 'obsidian' : 'ledger';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'obsidian');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
